<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Period product glyph</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<span role="img" aria-label="{{label}}" title="{{label}}" style="display: inline-block; width: {{px}}; height: {{px}}; line-height: 0; vertical-align: middle">
  <sc-if value="{{isTampon}}" hint-placeholder-val="{{true}}">
    <svg width="100%" height="100%" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="11" y="2" width="10" height="19" rx="5" fill="{{color}}"></rect>
      <path d="M11.5 8.5h9M11.5 13.5h9" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.4" fill="none"></path>
      <path d="M16 21c0 3-2 4-1 6s1 3 0 4" stroke="{{color}}" stroke-width="1.6" fill="none" stroke-linecap="round"></path>
    </svg>
  </sc-if>
  <sc-if value="{{isSuper}}" hint-placeholder-val="{{false}}">
    <svg width="100%" height="100%" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="8.5" y="1.5" width="15" height="20" rx="7.5" fill="{{color}}"></rect>
      <path d="M9.5 7.5h13M9 12h14M9.5 16.5h13" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.4" fill="none"></path>
      <path d="M16 21.5c0 3-2 4-1 6s1 2.5 0 4" stroke="{{color}}" stroke-width="1.6" fill="none" stroke-linecap="round"></path>
    </svg>
  </sc-if>
  <sc-if value="{{isPad}}" hint-placeholder-val="{{false}}">
    <svg width="100%" height="100%" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M10 11.5 4 13.2q-1.4 2.8 0 5.6l6 1.7z" fill="{{color}}" fill-opacity="0.7"></path>
      <path d="M22 11.5l6 1.7q1.4 2.8 0 5.6l-6 1.7z" fill="{{color}}" fill-opacity="0.7"></path>
      <rect x="9" y="1.5" width="14" height="29" rx="7" fill="{{color}}"></rect>
      <rect x="12" y="6" width="8" height="20" rx="4" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.3" stroke-dasharray="2 2"></rect>
    </svg>
  </sc-if>
  <sc-if value="{{isLiner}}" hint-placeholder-val="{{false}}">
    <svg width="100%" height="100%" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="11.5" y="3" width="9" height="26" rx="4.5" fill="{{color}}"></rect>
      <path d="M16 7v18" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="1.5 2" fill="none"></path>
    </svg>
  </sc-if>
  <sc-if value="{{isCup}}" hint-placeholder-val="{{false}}">
    <svg width="100%" height="100%" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M7 5h18v3c0 9-4.5 13-9 13S7 17 7 8z" fill="{{color}}"></path>
      <path d="M6.5 5h19" stroke="{{color}}" stroke-width="2.6" stroke-linecap="round" fill="none"></path>
      <path d="M10.5 9c.4 4.6 2.6 7.6 5.5 8.2" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.4" stroke-linecap="round" fill="none"></path>
      <path d="M16 21v8" stroke="{{color}}" stroke-width="2.2" stroke-linecap="round" fill="none"></path>
    </svg>
  </sc-if>
  <sc-if value="{{isUnderwear}}" hint-placeholder-val="{{false}}">
    <svg width="100%" height="100%" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M3 7h26l-2.5 12.5c-3.5.8-6.5 4-7.5 8.5h-6c-1-4.5-4-7.7-7.5-8.5z" fill="{{color}}"></path>
      <path d="M3 7h26l-.6 3H3.6z" fill="#FFFFFF" fill-opacity="0.35"></path>
      <path d="M12.6 21.5h6.8l-.6 6.5h-5.6z" fill="#FFFFFF" fill-opacity="0.3"></path>
    </svg>
  </sc-if>
  <sc-if value="{{isCombo}}" hint-placeholder-val="{{false}}">
    <svg width="100%" height="100%" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="3" y="4" width="8" height="15" rx="4" fill="{{color}}"></rect>
      <path d="M7 19c0 2.5-1.5 3.5-.8 5" stroke="{{color}}" stroke-width="1.4" fill="none" stroke-linecap="round"></path>
      <path d="M15.5 6v20" stroke="{{color}}" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="2 2" fill="none"></path>
      <rect x="19" y="3" width="10" height="26" rx="5" fill="{{color}}"></rect>
    </svg>
  </sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["tampon","super","pad","liner","cup","underwear","combo"],"default":"tampon"},"color":{"editor":"color","default":"#A3203A"},"size":{"editor":"int","default":96,"min":12,"max":400},"$preview":{"width":96,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    var k = this.props.kind || 'tampon';
    var labels = {
      tampon: 'Regular tampon', super: 'Super-absorbent tampon', pad: 'Sanitary napkin or pad',
      liner: 'Panty liner', cup: 'Menstrual cup', underwear: 'Period underwear',
      combo: 'Pads or tampons, not used together'
    };
    var size = this.props.size == null ? 96 : this.props.size;
    return {
      color: this.props.color || '#A3203A',
      px: size + 'px',
      label: labels[k] || '',
      isTampon: k === 'tampon', isSuper: k === 'super', isPad: k === 'pad', isLiner: k === 'liner',
      isCup: k === 'cup', isUnderwear: k === 'underwear', isCombo: k === 'combo'
    };
  }
}
</script>
</body>
</html>
